name: Publish Spice Labs configuration

# spice-config is a standalone artifact that versions and releases
# independently, following its own Java API SemVer. It ships on its own tag,
# `v<x.y.z>`, to GitHub Packages and Maven Central. SNAPSHOT versions go to
# GitHub Packages on every push to main by snapshot.yml, which is what lets
# every component build against the current rules between releases.
#
# Release this before any component that depends on a rule change in it: the
# whole point of a separate artifact is that the naming, layering and
# precedence rules have one implementation, so components must not carry
# private copies while waiting for a release.
on:
  push:
    tags:
      - "v*"

jobs:
  publish_plugin_api:
    name: Publish spice-config to GitHub Packages and Maven Central
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and extract version from tag
        id: validate
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "Tag does not match spice-config version pattern v*.*.*" >&2
            exit 1
          fi

      - name: Set up JDK 21 and GitHub Maven auth
        # setup-java imports the GPG key (gpg-private-key/gpg-passphrase) and
        # sets up Maven. The `github` server auth is written explicitly in the
        # next step (settings.xml heredoc) using GITHUB_ACTOR/GITHUB_TOKEN env
        # vars, so server-username/server-password are left at their defaults.
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          server-id: github
          token: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Write settings.xml for GitHub + Maven Central
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">

            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>

          </settings>
          EOF

      - name: Set spice-config version from tag
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.validate.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Publish spice-config to GitHub Packages
        run: mvn --batch-mode clean deploy -P github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Publish spice-config to Maven Central
        run: mvn --batch-mode clean deploy -P maven-central
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
